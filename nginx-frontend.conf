# Nginx configuration for EK-SMS React Frontend
# Place this file in /etc/nginx/sites-available/your-domain.com
# Then run: sudo ln -s /etc/nginx/sites-available/your-domain.com /etc/nginx/sites-enabled/
# And: sudo systemctl restart nginx

server {
    listen 80;
    server_name pruhsms.africa www.pruhsms.africa;

    root /var/www/ek-sms-frontend/build;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    # Handle React Router (SPA routing) - prevents 404 on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend (adjust URL as needed)
    location /api/ {
        proxy_pass https://backend.pruhsms.africa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# Redirect www to non-www (optional)
server {
    listen 80;
    server_name www.pruhsms.africa;
    return 301 http://pruhsms.africa$request_uri;
}