<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Invoice - EK-SMS Finance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        /* Hide scrollbar for a cleaner look but keep functionality */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3449; /* surface-variant */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #424754; /* outline-variant */
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#adc6ff",
                        "on-tertiary-fixed-variant": "#930013",
                        "on-primary": "#002e6a",
                        "on-primary-container": "#00285d",
                        "tertiary-fixed": "#ffdad7",
                        "on-error-container": "#ffdad6",
                        "on-tertiary": "#68000a",
                        "surface": "#0b1326",
                        "inverse-on-surface": "#283044",
                        "surface-bright": "#31394d",
                        "on-tertiary-container": "#5c0008",
                        "on-surface": "#dae2fd",
                        "on-secondary-fixed": "#002113",
                        "on-surface-variant": "#c2c6d6",
                        "error": "#ffb4ab",
                        "surface-container-high": "#222a3d",
                        "surface-tint": "#adc6ff",
                        "outline-variant": "#424754",
                        "secondary-container": "#00a572",
                        "error-container": "#93000a",
                        "surface-variant": "#2d3449",
                        "on-secondary-container": "#00311f",
                        "tertiary-fixed-dim": "#ffb3ad",
                        "background": "#0b1326",
                        "on-error": "#690005",
                        "tertiary-container": "#ff5451",
                        "inverse-surface": "#dae2fd",
                        "surface-container-low": "#131b2e",
                        "secondary": "#4edea3",
                        "primary-fixed": "#d8e2ff",
                        "on-primary-fixed": "#001a42",
                        "primary-fixed-dim": "#adc6ff",
                        "on-primary-fixed-variant": "#004395",
                        "tertiary": "#ffb3ad",
                        "inverse-primary": "#005ac2",
                        "secondary-fixed-dim": "#4edea3",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-container-lowest": "#060e20",
                        "outline": "#8c909f",
                        "secondary-fixed": "#6ffbbe",
                        "surface-container": "#171f33",
                        "primary-container": "#4d8eff",
                        "on-tertiary-fixed": "#410004",
                        "on-secondary": "#003824",
                        "surface-container-highest": "#2d3449",
                        "surface-dim": "#0b1326",
                        "on-background": "#dae2fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "8px",
                        "container-max": "1440px",
                        "base": "4px",
                        "lg": "32px",
                        "gutter": "24px",
                        "sm": "16px",
                        "md": "24px",
                        "xl": "48px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "data-mono": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "title-md": ["18px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased overflow-hidden">
<!-- Header / Task-Focused TopAppBar (Navigation Suppressed) -->
<header class="flex justify-between items-center px-lg h-xl w-full z-40 shrink-0 bg-background border-b border-outline-variant">
<div class="flex items-center gap-sm">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-variant hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg font-bold text-primary">Create New Invoice</h1>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 overflow-y-auto w-full">
<div class="max-w-3xl mx-auto p-sm md:p-lg flex flex-col gap-gutter">
<!-- Section: Student Selection -->
<section class="bg-surface-container-low border border-outline-variant rounded-xl p-md flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-on-surface">Recipient</h2>
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="student-search">Student</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="search">search</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg pl-10 pr-sm py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-body-md placeholder:text-outline shadow-sm" id="student-search" placeholder="Search student ID, name, or program..." type="text"/>
</div>
</div>
</section>
<!-- Section: Invoice Details -->
<section class="bg-surface-container-low border border-outline-variant rounded-xl p-md flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-on-surface">Invoice Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="invoice-date">Invoice Date</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-sm py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-data-mono text-data-mono shadow-sm color-scheme-dark" id="invoice-date" type="date"/>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="due-date">Due Date</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-sm py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-data-mono text-data-mono shadow-sm color-scheme-dark" id="due-date" type="date"/>
</div>
</div>
</section>
<!-- Section: Fee Items -->
<section class="bg-surface-container-low border border-outline-variant rounded-xl p-md flex flex-col gap-md">
<h2 class="font-title-md text-title-md text-on-surface">Fee Items</h2>
<!-- Desktop Header Row -->
<div class="hidden md:grid grid-cols-[1fr_180px_40px] gap-sm px-xs font-label-caps text-label-caps text-on-surface-variant uppercase border-b border-outline-variant/50 pb-2">
<div>Description</div>
<div class="text-right">Amount (USD)</div>
<div></div>
</div>
<!-- Items Container -->
<div class="flex flex-col gap-sm" id="fee-items-list">
<!-- Item Row 1 -->
<div class="grid grid-cols-1 md:grid-cols-[1fr_180px_40px] gap-sm items-start md:items-center bg-surface-container-highest md:bg-transparent p-sm md:p-0 rounded-lg md:rounded-none border border-outline-variant md:border-none group">
<div class="flex flex-col gap-base w-full">
<label class="md:hidden font-label-caps text-label-caps text-on-surface-variant uppercase">Description</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-sm py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md placeholder:text-outline" placeholder="e.g. Fall Semester Tuition" type="text" value="Tuition Fee - Fall 2024"/>
</div>
<div class="flex flex-col gap-base w-full">
<label class="md:hidden font-label-caps text-label-caps text-on-surface-variant uppercase">Amount</label>
<div class="relative group-focus-within:text-primary">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-outline font-data-mono text-data-mono transition-colors group-focus-within:text-primary">$</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg pl-8 pr-sm py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-data-mono text-data-mono text-right placeholder:text-outline" placeholder="0.00" type="text" value="4500.00"/>
</div>
</div>
<button aria-label="Remove item" class="mt-2 md:mt-0 w-10 h-10 flex items-center justify-center text-outline hover:text-error hover:bg-error/10 rounded-lg self-end md:self-auto transition-colors focus:outline-none focus:ring-2 focus:ring-error">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<!-- Item Row 2 -->
<div class="grid grid-cols-1 md:grid-cols-[1fr_180px_40px] gap-sm items-start md:items-center bg-surface-container-highest md:bg-transparent p-sm md:p-0 rounded-lg md:rounded-none border border-outline-variant md:border-none group">
<div class="flex flex-col gap-base w-full">
<label class="md:hidden font-label-caps text-label-caps text-on-surface-variant uppercase">Description</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg px-sm py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md placeholder:text-outline" placeholder="e.g. Fall Semester Tuition" type="text" value="Technology &amp; Library Fee"/>
</div>
<div class="flex flex-col gap-base w-full">
<label class="md:hidden font-label-caps text-label-caps text-on-surface-variant uppercase">Amount</label>
<div class="relative group-focus-within:text-primary">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-outline font-data-mono text-data-mono transition-colors group-focus-within:text-primary">$</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg pl-8 pr-sm py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-data-mono text-data-mono text-right placeholder:text-outline" placeholder="0.00" type="text" value="250.00"/>
</div>
</div>
<button aria-label="Remove item" class="mt-2 md:mt-0 w-10 h-10 flex items-center justify-center text-outline hover:text-error hover:bg-error/10 rounded-lg self-end md:self-auto transition-colors focus:outline-none focus:ring-2 focus:ring-error">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
</div>
<!-- Add Button -->
<button class="self-start flex items-center gap-2 px-sm py-2 mt-xs rounded-lg border border-primary text-primary hover:bg-primary/10 transition-colors font-title-md text-title-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-low">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
                    Add Fee Item
                </button>
</section>
<!-- Section: Summary -->
<section class="bg-surface-container-low border border-outline-variant rounded-xl p-md flex flex-col gap-sm items-end justify-center min-h-[140px] relative overflow-hidden">
<!-- Subtle background accent for the summary card -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent pointer-events-none"></div>
<div class="flex justify-between w-full md:w-[320px] items-center relative z-10">
<span class="font-body-md text-body-md text-on-surface-variant">Subtotal</span>
<span class="font-data-mono text-data-mono text-on-surface">$4,750.00</span>
</div>
<div class="flex justify-between w-full md:w-[320px] items-end border-t border-outline-variant pt-sm mt-xs relative z-10">
<span class="font-title-md text-title-md text-on-surface pb-1">Total Due</span>
<span class="font-display-lg text-display-lg text-primary tracking-tight">$4,750.00</span>
</div>
</section>
<!-- Actions -->
<div class="flex flex-col-reverse md:flex-row justify-end gap-sm mt-sm mb-xl">
<button class="px-md py-3 rounded-lg border border-outline-variant text-on-surface hover:bg-surface-variant hover:border-outline transition-all font-title-md text-title-md focus:outline-none focus:ring-2 focus:ring-outline w-full md:w-auto">
                    Cancel
                </button>
<button class="px-md py-3 rounded-lg bg-inverse-primary text-on-primary hover:bg-primary hover:text-on-primary-container transition-all shadow-[0_4px_14px_0_rgba(0,90,194,0.39)] hover:shadow-[0_6px_20px_rgba(0,90,194,0.23)] hover:-translate-y-0.5 font-title-md text-title-md flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background w-full md:w-auto">
<span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
                    Generate &amp; Send Invoice
                </button>
</div>
</div>
</main>
<style>
        /* Dark mode specific date picker styling */
        input[type="date"].color-scheme-dark::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }
        input[type="date"].color-scheme-dark::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</body></html>
