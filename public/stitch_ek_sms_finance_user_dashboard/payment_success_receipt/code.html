<div class="w-24 h-24 rounded-full bg-secondary-container/20 flex items-center justify-center mb-sm success-animation border border-secondary-container/50 shadow-[0_0_20px_rgba(0,165,114,0.3)]">
<span class="material-symbols-outlined text-secondary" style="font-size: 48px; font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">Payment Successful</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your transaction has been processed securely.</p>
</div>
<!-- Content Canvas -->
<div class="flex-1 flex flex-col p-md gap-gutter">
<!-- Total Paid Card -->
<div class="bg-surface rounded-lg p-md border border-outline-variant flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-secondary/5 to-transparent pointer-events-none"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-xs">Total Paid</span>
<span class="font-display-lg text-display-lg font-data-mono text-on-surface tracking-tight">$450.00</span>
</div>
<!-- Transaction Details Bento -->
<div class="grid grid-cols-1 gap-xs">
<h2 class="font-title-md text-title-md text-on-surface mb-xs">Transaction Details</h2>
<div class="bg-surface rounded-lg p-sm border border-outline-variant grid grid-cols-2 gap-y-sm">
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface-variant">Receipt No.</span>
<span class="font-data-mono text-data-mono text-on-surface">#RCP-9021</span>
</div>
<div class="flex flex-col text-right">
<span class="font-body-sm text-body-sm text-on-surface-variant">Date</span>
<span class="font-body-md text-body-md text-on-surface" id="current-date">Oct 26, 2023</span>
</div>
<div class="flex flex-col col-span-2 pt-xs border-t border-surface-variant">
<span class="font-body-sm text-body-sm text-on-surface-variant">Payment Method</span>
<div class="flex items-center gap-xs mt-base">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 20px;">phone_iphone</span>
<span class="font-body-md text-body-md text-on-surface">Mobile Money - MTN</span>
</div>
</div>
<div class="flex flex-col col-span-2 pt-xs border-t border-surface-variant">
<span class="font-body-sm text-body-sm text-on-surface-variant">Student Name</span>
<span class="font-body-md text-body-md text-on-surface">Alex Johnson</span>
</div>
</div>
</div>

<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Tuition Fee</span>
<span class="font-data-mono text-data-mono text-on-surface">$435.00</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Service Fee</span>
<span class="font-data-mono text-data-mono text-on-surface">$15.00</span>
</div>
<div class="w-full h-px bg-surface-variant my-base"></div>

</div>

<script>
        // Set dynamic date
        document.addEventListener('DOMContentLoaded', () => {
            const dateElement = document.getElementById('current-date');
            if (dateElement) {
                const options = { year: 'numeric', month: 'short', day: 'numeric' };
                dateElement.textContent = new Date().toLocaleDateString('en-US', options);
            }
        });
    </script>
