<style>
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<script>
        // Simple undo timer logic
        document.addEventListener('DOMContentLoaded', () => {
            const timerEl = document.getElementById('undo-timer');
            const progressEl = document.getElementById('undo-progress');
            const undoBtn = document.getElementById('undo-btn');
            
            let timeLeft = 10;
            const totalTime = 10;
            
            progressEl.style.transitionDuration = '1s';
            
            const interval = setInterval(() => {
                timeLeft -= 1;
                if (timeLeft >= 0) {
                    timerEl.textContent = timeLeft;
                    progressEl.style.width = `${(timeLeft / totalTime) * 100}%`;
                }
                
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    undoBtn.disabled = true;
                    undoBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    undoBtn.innerHTML = `<span>Action Finalized</span>`;
                }
            }, 1000);
            
            undoBtn.addEventListener('click', () => {
                if(timeLeft > 0) {
                    clearInterval(interval);
                    undoBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">check</span><span>Undoing...</span>`;
                    undoBtn.classList.add('text-secondary', 'border-secondary');
                    setTimeout(() => {
                        alert('Action undone. Returning to previous state.');
                    }, 500);
                }
            });
        });
    </script>
