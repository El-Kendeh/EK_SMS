<style>
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            animation: progress 3s linear infinite;
        }

        @keyframes progress {
            0% {
                stroke-dashoffset: 283;
            }
            50% {
                stroke-dashoffset: 141.5;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }
        
        .pulse-text {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .5;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-md relative">
<!-- TopAppBar Container -->
<header class="bg-surface dark:bg-surface fixed top-0 w-full z-50 border-b border-outline-variant flat no shadows flex items-center justify-between px-md h-16 w-full">
<div class="flex items-center gap-xs">
<button class="text-primary dark:text-primary hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md font-bold text-on-surface">Financial Reporting</h1>
</div>
<button class="text-primary dark:text-primary hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center pt-16 pb-safe lg:pb-0 px-sm lg:px-lg">
<div class="bg-[#0F172A] border border-[#1E293B] rounded-xl p-lg flex flex-col items-center justify-center text-center max-w-md w-full relative overflow-hidden">
<!-- Subtle background glow -->
<div class="absolute inset-0 bg-primary/5 rounded-xl blur-2xl z-0 pointer-events-none"></div>
<div class="z-10 flex flex-col items-center">
<!-- Circular Progress -->
<div class="relative w-32 h-32 mb-xl">
<svg class="w-full h-full" viewbox="0 0 100 100">
<!-- Background ring -->
<circle class="text-[#1E293B] stroke-current" cx="50" cy="50" fill="transparent" r="45" stroke-width="8"></circle>
<!-- Progress ring -->
<circle class="text-primary stroke-current progress-ring__circle" cx="50" cy="50" fill="transparent" r="45" stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl pulse-text" data-icon="analytics" data-weight="fill" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
</div>
<!-- Text Content -->
<h2 class="font-headline-lg-mobile lg:font-headline-lg text-headline-lg-mobile lg:text-headline-lg text-on-surface mb-xs pulse-text">Generating Revenue Summary Report...</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">Processing 1,240 records for Jan 2024 - Jun 2024.</p>
<!-- Action -->
<button class="border border-primary text-primary hover:bg-primary/10 transition-colors rounded-DEFAULT px-md py-xs font-title-md text-title-md w-full sm:w-auto flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
                    Cancel
                </button>
</div>
</div>
