<style>
        .success-checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            stroke-width: 2;
            stroke: #4edea3;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #4edea3;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
            margin: 0 auto;
        }

        .success-checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #4edea3;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .success-checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes scale {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale3d(1.1, 1.1, 1);
            }
        }

        @keyframes fill {
            100% {
                box-shadow: inset 0px 0px 0px 40px rgba(78, 222, 163, 0.1);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background border-b border-outline-variant dark:border-outline-variant flex justify-between items-center px-lg h-xl w-full z-40 docked full-width top-0">
<div class="flex items-center gap-sm">
<button class="p-xs text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-DEFAULT">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-black text-primary dark:text-primary hidden md:block">EK-SMS Dashboard</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-black text-primary dark:text-primary block md:hidden">EK-SMS Dashboard</h1>
</div>
<div class="flex items-center">
<button class="p-xs text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-DEFAULT">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-sm md:p-lg relative overflow-hidden">
<!-- Subtle Background Glow -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
<div class="w-[600px] h-[600px] bg-secondary rounded-full blur-[120px]"></div>
</div>
<div class="w-full max-w-xl bg-surface-container-low border border-outline-variant rounded-xl p-lg flex flex-col items-center text-center relative z-10 shadow-2xl">
<!-- Animated Success Icon -->
<div class="mb-lg">
<svg class="success-checkmark" viewbox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
<circle class="success-checkmark__circle" cx="26" cy="26" fill="none" r="25"></circle>
<path class="success-checkmark__check" d="M14.1 27.2l7.1 7.2 16.7-16.8" fill="none"></path>
</svg>
</div>
<h2 class="font-display-lg text-display-lg text-on-surface mb-sm">Invoice Sent Successfully</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl max-w-md">
                Invoice <span class="font-data-mono text-data-mono text-primary">#INV-2024-001</span> has been sent to Mr. &amp; Mrs. Johnson for student Alex Johnson.
            </p>
<!-- Summary Card -->
<div class="w-full bg-surface-container border border-outline-variant rounded-lg p-md mb-xl flex flex-col gap-sm text-left">
<div class="flex justify-between items-center pb-sm border-b border-outline-variant/50">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Total Amount</span>
<span class="font-data-mono text-[24px] leading-[32px] font-bold text-secondary">$4,750.00</span>
</div>
<div class="flex justify-between items-center pt-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Delivery Method</span>
<div class="flex gap-xs">
<span class="px-xs py-[2px] bg-primary/10 text-primary border border-primary/20 rounded font-label-caps text-label-caps flex items-center gap-[4px]">
<span class="material-symbols-outlined text-[14px]">mail</span> Email
                        </span>
<span class="px-xs py-[2px] bg-primary/10 text-primary border border-primary/20 rounded font-label-caps text-label-caps flex items-center gap-[4px]">
<span class="material-symbols-outlined text-[14px]">sms</span> SMS
                        </span>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-md w-full justify-center">
<button class="flex-1 px-md py-sm bg-primary text-on-primary font-title-md text-title-md rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background flex items-center justify-center gap-xs">
<span class="material-symbols-outlined">dashboard</span>
                    Back to Dashboard
                </button>
<button class="flex-1 px-md py-sm bg-transparent border border-primary text-primary font-title-md text-title-md rounded-lg hover:bg-primary/10 transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background flex items-center justify-center gap-xs">
<span class="material-symbols-outlined">add</span>

                </button>
</div>
