services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ek-sms-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: pruh_db
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ek-sms-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ek-sms-frontend
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3000
      NODE_ENV: development
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ek-sms-network

  mysql:
    image: mysql:8.0
    container_name: ek-sms-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pruh_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ek-sms-network

networks:
  ek-sms-network:
    driver: bridge

volumes:
  mysql_data:
