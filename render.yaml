services:
  - type: web
    name: ek-sms-backend
    runtime: node
    plan: free
    buildCommand: cd backend_node && npm ci --only=production
    startCommand: cd backend_node && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: pruh_db
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
